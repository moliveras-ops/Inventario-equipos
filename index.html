<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d6b">
<title>Inventario Equipos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{--azul:#0b3d6b;--azul2:#155a9c;--gris:#f2f4f7;--borde:#d0d5dd;--txt:#1d2939;--ok:#12813b;--baja:#b42318;--cal:#b54708}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--gris);color:var(--txt)}
  header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header img{height:38px;background:#fff;border-radius:6px;padding:3px}
  header h1{font-size:1.1rem;margin:0;flex:1}
  main{max-width:900px;margin:0 auto;padding:12px 16px 90px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:1rem;background:#fff}
  .bar input{flex:2;min-width:160px}.bar select{flex:1;min-width:120px}
  button{border:0;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer;background:var(--azul2);color:#fff}
  button.sec{background:#fff;color:var(--azul);border:1px solid var(--azul2)}
  button.del{background:var(--baja)}
  .stats{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .stats div{background:#fff;border-radius:8px;padding:8px 12px;font-size:.85rem;border:1px solid var(--borde)}
  .card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:10px;display:flex;gap:10px;margin-bottom:8px;cursor:pointer}
  .card img,.card .ph{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--gris);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
  .card .info{flex:1;min-width:0}
  .card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card small{color:#667085}
  .tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:10px;color:#fff;margin-top:4px}
  .Operativo{background:var(--ok)}.Dado.de.baja,.baja{background:var(--baja)}.cal{background:var(--cal)}
  .fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;font-size:2rem;box-shadow:0 4px 12px #0004}
  dialog{border:0;border-radius:12px;padding:0;width:min(560px,96vw);max-height:92vh}
  dialog::backdrop{background:#0006}
  .dlg{padding:16px;overflow:auto;max-height:92vh}
  .dlg h2{margin:0 0 12px;font-size:1.1rem}
  label{display:block;font-size:.8rem;color:#475467;margin:8px 0 3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end}
  #prevFoto{max-width:100%;max-height:220px;border-radius:8px;margin-top:6px;display:none}
  #qrBox{display:flex;justify-content:center;padding:10px}
  .det td{padding:4px 6px;border-bottom:1px solid var(--gris);vertical-align:top}.det td:first-child{color:#667085;width:40%}
  .catrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.catrow span{flex:1}
  .venc{color:var(--baja);font-weight:600}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="logo-iqs.png" alt="IQS" onerror="this.style.display='none'">
  <h1>Inventario Equipos</h1>
  <button class="sec" onclick="abrirMenu()">☰</button>
</header>

<main>
  <div class="bar">
    <input id="q" placeholder="Buscar código, serie, marca, modelo…" oninput="render()">
    <select id="fCat" onchange="render()"></select>
    <select id="fEst" onchange="render()">
      <option value="">Todos los estados</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div id="lista"></div>
</main>

<button class="fab" onclick="editar()">+</button>

<!-- Formulario equipo -->
<dialog id="dForm"><form class="dlg" onsubmit="guardar(event)">
  <h2 id="fTit">Nuevo equipo</h2>
  <div class="grid2">
    <div><label>Categoría *</label><select id="e_cat" required></select></div>
    <div><label>Código interno *</label><input id="e_cod" required placeholder="IQS-UT-001"></div>
    <div><label>Marca</label><input id="e_marca" placeholder="Olympus, GE…"></div>
    <div><label>Modelo</label><input id="e_modelo" placeholder="38DL Plus, D790…"></div>
    <div><label>N° de serie</label><input id="e_serie"></div>
    <div><label>Estado</label><select id="e_est"></select></div>
    <div><label>Frecuencia / tipo (transductores)</label><input id="e_frec" placeholder="5 MHz dual, 10 mm"></div>
    <div><label>Ubicación / responsable</label><input id="e_ubic" placeholder="Bodega Concepción / M. …"></div>
    <div><label>Última calibración</label><input id="e_fcal" type="date"></div>
    <div><label>Próxima calibración</label><input id="e_fprox" type="date"></div>
    <div><label>N° certificado</label><input id="e_cert"></div>
    <div><label>Equipo asociado</label><input id="e_asoc" placeholder="Ej.: medidor al que pertenece"></div>
  </div>
  <label>Observaciones</label><textarea id="e_obs" rows="2"></textarea>
  <label>Foto</label>
  <input type="file" id="e_foto" accept="image/*" capture="environment" onchange="cargarFoto(this)">
  <img id="prevFoto" alt="">
  <div class="acts">
    <button type="button" class="del" id="btnDel" onclick="eliminar()">Eliminar</button>
    <button type="button" class="sec" onclick="dForm.close()">Cancelar</button>
    <button type="submit">Guardar</button>
  </div>
</form></dialog>

<!-- Detalle -->
<dialog id="dDet"><div class="dlg">
  <h2 id="dTit"></h2>
  <img id="dFoto" style="max-width:100%;max-height:240px;border-radius:8px;display:none">
  <table class="det" id="dTabla" style="width:100%;border-collapse:collapse;margin-top:8px"></table>
  <div id="qrBox"></div>
  <div class="acts">
    <button class="sec" onclick="descargarQR()">Descargar QR</button>
    <button class="sec" onclick="fichaPDF()">Ficha PDF</button>
    <button class="sec" onclick="editar(actual)">Editar</button>
    <button onclick="dDet.close()">Cerrar</button>
  </div>
</div></dialog>

<!-- Menú -->
<dialog id="dMenu"><div class="dlg">
  <h2>Opciones</h2>
  <div style="display:grid;gap:8px">
    <button onclick="exportarExcel()">📊 Exportar Excel</button>
    <button onclick="exportarPDF()">📄 Informe PDF (listado)</button>
    <button onclick="etiquetasPDF()">🏷️ Etiquetas QR (PDF)</button>
    <button class="sec" onclick="abrirCats()">🗂️ Administrar categorías</button>
    <button class="sec" onclick="respaldo()">💾 Descargar respaldo (JSON)</button>
    <button class="sec" onclick="document.getElementById('impJson').click()">⤴️ Restaurar respaldo</button>
    <input type="file" id="impJson" accept=".json" hidden onchange="restaurar(this)">
    <button class="sec" onclick="dMenu.close()">Cerrar</button>
  </div>
</div></dialog>

<!-- Categorías -->
<dialog id="dCats"><div class="dlg">
  <h2>Categorías</h2>
  <div id="catLista"></div>
  <div class="catrow"><input id="nuevaCat" placeholder="Nueva categoría"><button onclick="agregarCat()">Agregar</button></div>
  <div class="acts"><button onclick="dCats.close()">Listo</button></div>
</div></dialog>

<script>
const ESTADOS = ["Operativo","En calibración","En reparación","Dado de baja"];
const CATS_DEF = ["Medidor de espesor","Transductor","Yugo magnético"];
const ICONOS = {"Medidor de espesor":"📟","Transductor":"🔘","Yugo magnético":"🧲"};
let equipos = [], cats = [], actual = null, fotoTmp = null;

/* ---------- IndexedDB ---------- */
let db;
function abrirDB(){return new Promise((ok,err)=>{
  const r=indexedDB.open("inventarioIQS",1);
  r.onupgradeneeded=e=>{const d=e.target.result;d.createObjectStore("equipos",{keyPath:"id"});d.createObjectStore("config")};
  r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=err;
})}
const tx=(s,m="readonly")=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((ok,err)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>err(r.error)});
const dbAll=()=>req(tx("equipos").getAll());
const dbPut=e=>req(tx("equipos","readwrite").put(e));
const dbDel=id=>req(tx("equipos","readwrite").delete(id));
const cfgGet=k=>req(tx("config").get(k));
const cfgSet=(k,v)=>req(tx("config","readwrite").put(v,k));

/* ---------- Inicio ---------- */
(async()=>{
  await abrirDB();
  cats = (await cfgGet("cats")) || CATS_DEF.slice();
  equipos = await dbAll();
  llenarSelects(); render();
  const m = location.hash.match(/eq=([^&]+)/);
  if(m) ver(decodeURIComponent(m[1]));
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
})();
window.addEventListener("hashchange",()=>{const m=location.hash.match(/eq=([^&]+)/);if(m)ver(decodeURIComponent(m[1]))});

function llenarSelects(){
  fCat.innerHTML='<option value="">Todas las categorías</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join("");
  e_cat.innerHTML=cats.map(c=>`<option>${esc(c)}</option>`).join("");
  fEst.innerHTML='<option value="">Todos los estados</option>'+ESTADOS.map(s=>`<option>${s}</option>`).join("");
  e_est.innerHTML=ESTADOS.map(s=>`<option>${s}</option>`).join("");
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoy=()=>new Date().toISOString().slice(0,10);
const fmt=d=>d?d.split("-").reverse().join("-"):"";
const vencido=e=>e.fprox && e.fprox<hoy() && e.est!=="Dado de baja";
const claseEst=s=>s==="Operativo"?"Operativo":s==="Dado de baja"?"baja":"cal";

/* ---------- Listado ---------- */
function filtrados(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  return equipos.filter(e=>(!fCat.value||e.cat===fCat.value)&&(!fEst.value||e.est===fEst.value)&&
    (!q||[e.cod,e.serie,e.marca,e.modelo,e.ubic,e.frec].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>a.cod.localeCompare(b.cod,"es",{numeric:true}));
}
function render(){
  const l=filtrados();
  const cnt=s=>equipos.filter(e=>e.est===s).length;
  stats.innerHTML=`<div>Total: <b>${equipos.length}</b></div><div>Operativos: <b>${cnt("Operativo")}</b></div>
    <div>De baja: <b>${cnt("Dado de baja")}</b></div><div>Calibración vencida: <b class="venc">${equipos.filter(vencido).length}</b></div>`;
  lista.innerHTML=l.length?l.map(e=>`<div class="card" onclick="ver('${e.id}')">
    ${e.foto?`<img src="${e.foto}">`:`<div class="ph">${ICONOS[e.cat]||"🔧"}</div>`}
    <div class="info"><b>${esc(e.cod)} · ${esc(e.marca)} ${esc(e.modelo)}</b>
    <small>${esc(e.cat)} · S/N ${esc(e.serie)||"—"}${e.fprox?` · Próx. cal.: <span class="${vencido(e)?"venc":""}">${fmt(e.fprox)}</span>`:""}</small><br>
    <span class="tag ${claseEst(e.est)}">${e.est}</span></div></div>`).join("")
    :'<p style="text-align:center;color:#667085;margin-top:40px">Sin equipos. Toca + para agregar.</p>';
}

/* ---------- Formulario ---------- */
const CAMPOS=["cat","cod","marca","modelo","serie","est","frec","ubic","fcal","fprox","cert","asoc","obs"];
function editar(id){
  dDet.open&&dDet.close();
  const e=equipos.find(x=>x.id===id)||{};
  fTit.textContent=e.id?"Editar equipo":"Nuevo equipo";
  CAMPOS.forEach(c=>document.getElementById("e_"+c).value=e[c]||"");
  if(!e.id){e_est.value="Operativo";if(fCat.value)e_cat.value=fCat.value}
  fotoTmp=e.foto||null; prevFoto.src=fotoTmp||""; prevFoto.style.display=fotoTmp?"block":"none";
  e_foto.value=""; btnDel.style.display=e.id?"":"none";
  actual=e.id||null; dForm.showModal();
}
function cargarFoto(inp){
  const f=inp.files[0]; if(!f)return;
  const img=new Image(); img.onload=()=>{
    const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    fotoTmp=c.toDataURL("image/jpeg",0.75);prevFoto.src=fotoTmp;prevFoto.style.display="block";URL.revokeObjectURL(img.src);
  }; img.src=URL.createObjectURL(f);
}
async function guardar(ev){
  ev.preventDefault();
  const e={id:actual||crypto.randomUUID(),foto:fotoTmp,act:new Date().toISOString()};
  CAMPOS.forEach(c=>e[c]=document.getElementById("e_"+c).value.trim());
  if(equipos.some(x=>x.cod.toLowerCase()===e.cod.toLowerCase()&&x.id!==e.id))return alert("Ya existe un equipo con ese código.");
  await dbPut(e); equipos=await dbAll(); dForm.close(); render(); ver(e.id);
}
async function eliminar(){
  if(!confirm("¿Eliminar definitivamente este equipo? (Si ya no se usa, mejor márcalo como 'Dado de baja')"))return;
  await dbDel(actual); equipos=await dbAll(); dForm.close(); render();
}

/* ---------- Detalle y QR ---------- */
const urlEq=id=>location.origin+location.pathname+"#eq="+encodeURIComponent(id);
function ver(id){
  const e=equipos.find(x=>x.id===id||x.cod===id); if(!e)return;
  actual=e.id; dTit.textContent=`${e.cod} — ${e.cat}`;
  dFoto.src=e.foto||""; dFoto.style.display=e.foto?"block":"none";
  const filas=[["Marca",e.marca],["Modelo",e.modelo],["N° serie",e.serie],["Estado",e.est],["Frecuencia / tipo",e.frec],
    ["Ubicación / responsable",e.ubic],["Última calibración",fmt(e.fcal)],["Próxima calibración",fmt(e.fprox)+(vencido(e)?" ⚠️ VENCIDA":"")],
    ["Certificado",e.cert],["Equipo asociado",e.asoc],["Observaciones",e.obs]];
  dTabla.innerHTML=filas.filter(f=>f[1]).map(f=>`<tr><td>${f[0]}</td><td>${esc(f[1])}</td></tr>`).join("");
  qrBox.innerHTML=""; new QRCode(qrBox,{text:urlEq(e.id),width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
  dDet.open||dDet.showModal();
}
function qrDataURL(txt,size=300){
  const d=document.createElement("div"); new QRCode(d,{text:txt,width:size,height:size,correctLevel:QRCode.CorrectLevel.M});
  return d.querySelector("canvas").toDataURL("image/png");
}
function descargarQR(){
  const e=equipos.find(x=>x.id===actual),a=document.createElement("a");
  a.href=qrDataURL(urlEq(e.id),400);a.download=`QR_${e.cod}.png`;a.click();
}

/* ---------- Logo para PDF ---------- */
let logoData=null;
(function(){const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=i.width;c.height=i.height;
  c.getContext("2d").drawImage(i,0,0);logoData={d:c.toDataURL("image/png"),r:i.width/i.height}};i.src="logo-iqs.png"})();
function encabezado(doc,titulo){
  if(logoData)doc.addImage(logoData.d,"PNG",14,8,14*logoData.r,14);
  doc.setFontSize(14);doc.text(titulo,logoData?20+14*logoData.r:14,17);
  doc.setFontSize(9);doc.text("Fecha: "+fmt(hoy()),doc.internal.pageSize.getWidth()-14,17,{align:"right"});
  doc.line(14,24,doc.internal.pageSize.getWidth()-14,24);
}

/* ---------- Exportaciones ---------- */
const COLS=[["cod","Código"],["cat","Categoría"],["marca","Marca"],["modelo","Modelo"],["serie","N° serie"],["est","Estado"],
  ["frec","Frec./tipo"],["ubic","Ubicación"],["fcal","Últ. calibración"],["fprox","Próx. calibración"],["cert","Certificado"],["asoc","Asociado a"],["obs","Observaciones"]];
function exportarExcel(){
  const filas=filtrados().map(e=>Object.fromEntries(COLS.map(([k,t])=>[t,k.startsWith("f")&&k!=="frec"?fmt(e[k]):e[k]||""])));
  const ws=XLSX.utils.json_to_sheet(filas);ws["!cols"]=COLS.map(()=>({wch:16}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Inventario");
  XLSX.writeFile(wb,`Inventario_Equipos_${hoy()}.xlsx`);
}
function exportarPDF(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:"landscape"});
  encabezado(doc,"Inventario de Equipos");
  const cols=COLS.slice(0,10);
  doc.autoTable({startY:28,head:[cols.map(c=>c[1])],body:filtrados().map(e=>cols.map(([k])=>k.startsWith("f")&&k!=="frec"?fmt(e[k]):e[k]||"")),
    styles:{fontSize:8},headStyles:{fillColor:[11,61,107]},
    didParseCell:d=>{if(d.section==="body"&&d.column.index===5&&d.cell.raw==="Dado de baja")d.cell.styles.textColor=[180,35,24]}});
  doc.save(`Inventario_Equipos_${hoy()}.pdf`);
}
function fichaPDF(){
  const e=equipos.find(x=>x.id===actual),{jsPDF}=window.jspdf,doc=new jsPDF();
  encabezado(doc,"Ficha de equipo — "+e.cod);
  let y=30;
  if(e.foto){doc.addImage(e.foto,"JPEG",14,y,80,60);}
  doc.addImage(qrDataURL(urlEq(e.id)),"PNG",150,y,45,45);
  doc.autoTable({startY:e.foto?y+66:y+50,body:COLS.map(([k,t])=>[t,k.startsWith("f")&&k!=="frec"?fmt(e[k]):e[k]||"—"]),
    styles:{fontSize:10},columnStyles:{0:{fontStyle:"bold",cellWidth:50}}});
  doc.save(`Ficha_${e.cod}.pdf`);
}
function etiquetasPDF(){
  const l=filtrados(); if(!l.length)return alert("No hay equipos para imprimir.");
  const {jsPDF}=window.jspdf,doc=new jsPDF();
  const W=63,H=38,cols=3,filas=7,mx=7,my=12; let i=0;
  l.forEach(e=>{
    if(i&&i%(cols*filas)===0)doc.addPage();
    const n=i%(cols*filas),x=mx+(n%cols)*W,y=my+Math.floor(n/cols)*H;
    doc.rect(x,y,W-2,H-2);
    doc.addImage(qrDataURL(urlEq(e.id),200),"PNG",x+2,y+2,32,32);
    doc.setFontSize(9);doc.setFont(undefined,"bold");doc.text(e.cod,x+36,y+8,{maxWidth:24});
    doc.setFont(undefined,"normal");doc.setFontSize(7);
    doc.text([e.cat,`${e.marca} ${e.modelo}`,"S/N "+(e.serie||"—")],x+36,y+14,{maxWidth:24});
    if(logoData)doc.addImage(logoData.d,"PNG",x+36,y+27,6*logoData.r,6);
    i++;
  });
  doc.save(`Etiquetas_QR_${hoy()}.pdf`);
}

/* ---------- Menú, categorías, respaldo ---------- */
function abrirMenu(){dMenu.showModal()}
function abrirCats(){dMenu.close();pintarCats();dCats.showModal()}
function pintarCats(){
  catLista.innerHTML=cats.map((c,i)=>`<div class="catrow"><span>${esc(c)} (${equipos.filter(e=>e.cat===c).length})</span>
    <button class="del" onclick="borrarCat(${i})">✕</button></div>`).join("");
}
async function agregarCat(){
  const v=nuevaCat.value.trim(); if(!v||cats.includes(v))return;
  cats.push(v);await cfgSet("cats",cats);nuevaCat.value="";llenarSelects();pintarCats();
}
async function borrarCat(i){
  if(equipos.some(e=>e.cat===cats[i]))return alert("Hay equipos en esta categoría. Cámbialos antes de borrarla.");
  cats.splice(i,1);await cfgSet("cats",cats);llenarSelects();pintarCats();render();
}
function respaldo(){
  const b=new Blob([JSON.stringify({cats,equipos})],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`respaldo_inventario_${hoy()}.json`;a.click();
}
async function restaurar(inp){
  const f=inp.files[0]; if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!confirm(`Se importarán ${d.equipos.length} equipos (se actualizan los que ya existan). ¿Continuar?`))return;
    for(const e of d.equipos)await dbPut(e);
    cats=[...new Set([...cats,...(d.cats||[])])];await cfgSet("cats",cats);
    equipos=await dbAll();llenarSelects();render();dMenu.close();alert("Respaldo restaurado.");
  }catch(err){alert("Archivo no válido.")}
  inp.value="";
}
</script>
</body>
</html>
